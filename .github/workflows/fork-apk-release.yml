# prokrypt fork only: on manual dispatch, builds signed F-Droid- and Google-flavor APKs from main and publishes them as a
# GitHub Release, so Obtainium can install and update them from https://github.com/prokrypt/Meshtastic-Android.
# Needs two repository secrets: RELEASE_KEYSTORE_B64 (base64 of the keystore) and
# RELEASE_KEYSTORE_PASSWORD (store and key password; key alias "release").
# Optional secret MAPS_API_KEY: a Google Maps key for the Google flavor; without it that map is blank.
# The Google flavor uses the tracked placeholder Firebase config, so it reports nothing to Firebase.
name: Fork APK release

# Manual only: releases are started on request (Actions > Fork APK release > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-apk-release
  cancel-in-progress: true

env:
  # Separate app ID and label so this build installs next to the official app. Empty keeps the
  # official ID (then the official app must be uninstalled first: the signing keys differ).
  FORK_APPLICATION_ID: com.geeksville.mesh.prokrypt
  FORK_APP_NAME: Meshtashtic

jobs:
  release:
    if: github.repository == 'prokrypt/Meshtastic-Android'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # versionCode is derived from the commit count

      - name: Gradle Setup
        uses: ./.github/actions/gradle-setup
        with:
          cache_read_only: 'false'

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_B64 and RELEASE_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > androidApp/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Apply fork app ID and name
        if: env.FORK_APPLICATION_ID != ''
        run: |
          sed -i "s/^APPLICATION_ID=.*/APPLICATION_ID=${FORK_APPLICATION_ID}/" config.properties
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${FORK_APP_NAME}</string>|" \
            androidApp/src/main/res/values/strings.xml
          grep -n '^APPLICATION_ID=' config.properties

      - name: Prepare the Google flavor
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # google-services needs a client entry for the package name, else the build fails.
          python3 - "$(grep '^APPLICATION_ID=' config.properties | cut -d= -f2)" <<'PY'
          import copy, json, sys
          path, app_id = "androidApp/google-services.json", sys.argv[1]
          data = json.load(open(path))
          if all(c["client_info"]["android_client_info"]["package_name"] != app_id for c in data["client"]):
              client = copy.deepcopy(data["client"][0])
              client["client_info"]["android_client_info"]["package_name"] = app_id
              data["client"].append(client)
              json.dump(data, open(path, "w"), indent=2)
          PY
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> google.properties
          else
            echo "::warning::MAPS_API_KEY secret is not set, so the Google-flavor map will be blank"
          fi
          # The placeholder Firebase project can't take a Crashlytics mapping upload.
          cat > "$RUNNER_TEMP/no-crashlytics-upload.gradle" <<'GRADLE'
          // beforeProject, not allprojects: the build uses isolated projects.
          gradle.lifecycle.beforeProject { p ->
            p.tasks.configureEach { t -> if (t.name.startsWith('uploadCrashlyticsMappingFile')) t.enabled = false }
          }
          GRADLE

      - name: Set version
        run: |
          base=$(grep '^VERSION_NAME_BASE=' config.properties | cut -d= -f2)
          echo "VERSION_NAME=${base}-pk.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build the F-Droid and Google release APKs
        run: |
          ./gradlew :androidApp:assembleFdroidRelease :androidApp:assembleGoogleRelease \
            --init-script "$RUNNER_TEMP/no-crashlytics-upload.gradle"

      - name: Write release notes
        run: |
          git fetch --no-tags https://github.com/meshtastic/Meshtastic-Android main:refs/remotes/upstream/main
          .github/scripts/fork-release-notes.sh HEAD upstream/main | tee "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          outs=()
          for flavor in google fdroid; do
            dir="androidApp/build/outputs/apk/${flavor}/release"
            # The universal APK runs on every phone; without ABI splits there is only one APK.
            apk=$(ls "$dir"/*universal*.apk 2>/dev/null | head -n1)
            [ -n "$apk" ] || apk=$(ls "$dir"/*.apk | head -n1)
            out="meshtashtic-${flavor}-${VERSION_NAME}.apk"
            cp "$apk" "$out"
            outs+=("$out")
          done
          gh release create "v${VERSION_NAME}" "${outs[@]}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md"
